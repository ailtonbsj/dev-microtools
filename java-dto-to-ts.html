<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java DTO → Angular Model</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#667085;--bd:#d8dce3;--ac:#2f6fed;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1a1f28;--fg:#e6e9ef;--mut:#8b94a5;--bd:#2c3340;--ac:#5b8cff;--acf:#0b1020}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1a1f28;--fg:#e6e9ef;--mut:#8b94a5;--bd:#2c3340;--ac:#5b8cff;--acf:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
h1{font-size:1.3rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
label.chk{display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.grid{grid-template-columns:1fr}label.chk{margin-left:0}}
.col{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.col h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0}
textarea{width:100%;min-height:440px;resize:vertical;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}
#msg{min-height:1.4em;margin-top:12px;font-size:.9rem;color:var(--mut)}
#msg.err{color:#d92d20}
</style>
</head>
<body>
<main>
<h1>Java DTO → Angular Model</h1>
<p class="sub">Converte uma classe DTO Java em uma <code>interface</code> TypeScript usando <code>java-ast</code>.</p>
<div class="bar">
  <button id="paste">📋 Colar do clipboard</button>
  <button id="convert" class="pri">Converter</button>
  <button id="copy">Copiar resultado</button>
  <button id="turbo">⚡ Turbo</button>
  <label class="chk"><input type="checkbox" id="keep" checked> Preservar comentários</label>
</div>
<div class="grid">
  <div class="col"><h2>Java</h2><textarea id="in" spellcheck="false" placeholder="Cole aqui o código do DTO Java..."></textarea></div>
  <div class="col"><h2>TypeScript</h2><textarea id="out" spellcheck="false" readonly></textarea></div>
</div>
<div id="msg" role="status"></div>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };

const parse = window.JavaAST && window.JavaAST.parse;
if (parse) msg("java-ast carregada. Cole um DTO e converta.");
else msg("Falha ao inicializar a java-ast embutida.", true);

const NUM = "Long Integer Short Byte Double Float BigDecimal BigInteger Number int long short byte double float".split(" ");
const STR = "String Character char UUID CharSequence".split(" ");
const BOOL = ["Boolean", "boolean"];
const DATE = "LocalDateTime LocalDate LocalTime Date Instant ZonedDateTime OffsetDateTime Timestamp".split(" ");
const LIST = "List Set Collection Iterable ArrayList LinkedList HashSet Page".split(" ");

const kebab = n => n.replace(/([a-z0-9])([A-Z])/g, "$1-$2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1-$2").toLowerCase();

function splitArgs(s) {
  const r = []; let d = 0, cur = "";
  for (const c of s) {
    if (c === "<") d++; if (c === ">") d--;
    if (c === "," && !d) { r.push(cur); cur = ""; } else cur += c;
  }
  if (cur) r.push(cur);
  return r;
}

function tsType(t, deps) {
  t = t.replace(/@\w+(\([^)]*\))?/g, "").trim().replace(/\?.*$/, "any");
  if (t.endsWith("[]")) return tsType(t.slice(0, -2), deps) + "[]";
  const g = t.match(/^([\w.]+)<(.*)>$/);
  if (g) {
    const base = g[1].split(".").pop(), args = splitArgs(g[2]).map(a => tsType(a, deps));
    if (LIST.includes(base)) return (/[|<]/.test(args[0]) ? `(${args[0]})` : args[0]) + "[]";
    if (/Map$/.test(base)) return `Record<${args[0]}, ${args[1] ?? "any"}>`;
    if (base === "Optional") return args[0];
    deps.add(base);
    return `${base}<${args.join(", ")}>`;
  }
  const n = t.split(".").pop();
  if (NUM.includes(n)) return "number";
  if (STR.includes(n)) return "string";
  if (BOOL.includes(n)) return "boolean";
  if (DATE.includes(n)) return "Date";
  if (n === "Object") return "any";
  if (LIST.includes(n)) return "any[]";
  if (/Map$/.test(n)) return "Record<string, any>";
  if (n.length > 1) deps.add(n);
  return n;
}

function commentsOnly(gap) {
  const t = gap.replace(/[ \t]+$/, "").split("\n").map(l => l.trim()).map(l => l.startsWith("*") ? " " + l : l).join("\n");
  return t && !t.endsWith("\n") ? t + "\n" : t;
}

function convert(src, keep) {
  const cu = parse(src);
  let cd;
  for (const td of cu.typeDeclaration()) { cd = td.classDeclaration && td.classDeclaration(); if (cd) break; }
  if (!cd) throw new Error("Nenhuma classe encontrada.");
  const name = (cd.identifier ? cd.identifier() : cd.IDENTIFIER()).text;
  const body = cd.classBody();
  const deps = new Set();
  let prev = body.start.stopIndex + 1, out = "";

  for (const m of body.classBodyDeclaration()) {
    const mem = m.memberDeclaration && m.memberDeclaration();
    const f = mem && mem.fieldDeclaration && mem.fieldDeclaration();
    const isStatic = m.modifier && m.modifier().some(x => x.text === "static");
    if (f && !isStatic) {
      if (keep) out += commentsOnly(src.slice(prev, m.start.startIndex));
      const type = tsType(f.typeType().text, deps);
      for (const v of f.variableDeclarators().variableDeclarator())
        out += `${v.variableDeclaratorId().text}: ${type};\n`;
    }
    prev = m.stop.stopIndex + 1;
  }
  if (keep) out += commentsOnly(src.slice(prev, body.stop.startIndex));

  const lines = [];
  for (const l of out.split("\n")) {
    const t = l.replace(/\s+$/, "");
    if (!t.trim() && (!lines.length || !lines[lines.length - 1])) continue;
    lines.push(t.trim() ? "    " + t.trimStart().replace(/^(?=\*)/, " ") : "");
  }
  while (lines.length && !lines[lines.length - 1]) lines.pop();
  const imports = [...deps].filter(d => d !== name).sort()
    .map(d => `import { ${d} } from "../${kebab(d)}.model";`).join("\n");
  return (imports ? imports + "\n\n" : "") + `export interface ${name} {\n${lines.join("\n")}\n}\n`;
}

function run() {
  if (!parse) { msg("A biblioteca java-ast não está disponível.", true); return false; }
  const src = $("in").value.trim();
  if (!src) { msg("Cole um código Java primeiro.", true); return false; }
  try {
    $("out").value = convert(src, $("keep").checked);
    msg("Convertido com sucesso.");
    return true;
  } catch (e) {
    msg("Erro ao converter: " + e.message, true);
    return false;
  }
}

async function paste() {
  try { $("in").value = await navigator.clipboard.readText(); return true; }
  catch { msg("Sem permissão para ler o clipboard. Use Ctrl+V no campo.", true); return false; }
}
async function copy() {
  if (!$("out").value) { msg("Nada para copiar.", true); return false; }
  try { await navigator.clipboard.writeText($("out").value); msg("Copiado para o clipboard."); return true; }
  catch { $("out").select(); msg("Não foi possível copiar automaticamente. Use Ctrl+C.", true); return false; }
}

$("paste").onclick = async () => { if (await paste()) msg("Colado do clipboard."); };
$("convert").onclick = run;
$("copy").onclick = copy;
$("keep").onchange = () => { if ($("in").value.trim() && $("out").value) run(); };
$("turbo").onclick = async () => {
  if (await paste() && run() && await copy()) msg("⚡ Colado, convertido e copiado!");
};
</script>
</body>
